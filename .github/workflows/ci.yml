name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: unit tests
        run: pytest -q
      # The eval suite runs in CI because it runs offline. A regression suite
      # that needs an API key is a regression suite that stops running.
      - name: golden cases
        run: python evals/run_evals.py
