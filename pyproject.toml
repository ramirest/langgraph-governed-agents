[project]
name = "governed-agents"
version = "0.1.0"
description = "A reference implementation of hierarchical agents with enforced permissions, cost ceilings, groundedness scoring and a human gate, built on LangGraph."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pyyaml>=6",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
